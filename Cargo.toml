[package]
name = "swjobs_today"
version = "0.1.0"
edition = "2024"
autobins = false

[[bin]]
name = "sjt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.9", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["blocking", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
